# yaml-language-server: $schema=.smelt.schema.json
version: 1

project:
  root_packages: [harnessed]
  source_roots: ['.']
  test_roots: [tests]
  coverage: strict
  exclude:
    - path: .harnessed/**
      reason: Generated session data and test workspaces are not repository source or configuration.
    - path: .claude/worktrees/**
      reason: Independent agent checkouts have their own policy and must not enter this checkout's inventory.
    - path: build/**
      reason: Local generated wheel contents and maintainer scratch scripts are not source modules.
    - path: examples/**
      reason: Consumer examples exercise the public SDK and run in tests/test_examples.py.
    - path: scripts/**
      reason: Maintainer tools are checked by Ruff, ty and the wheel smoke check.

architecture:
  modules:
    harnessed: sdk
    harnessed.kernel: kernel
    harnessed.errors: contracts
    harnessed.models: contracts
    harnessed.events: events
    harnessed.events.codec: engine
    harnessed.events.completion: engine
    harnessed.events.live: engine
    harnessed.events.registry: engine
    harnessed.events.stream: engine
    harnessed.runtime: engine
    harnessed.prompts: engine
    harnessed.sessions: engine
    harnessed.tools: engine
    harnessed.plugins: plugins
    harnessed.models.pydantic_ai: model_adapters
    harnessed.integrations: integrations
    harnessed.testing: testing
    harnessed.tracing: sdk
  layers:
    kernel:
      path: kernel
      may_depend_on: []
      third_party: {default: deny}
    contracts:
      path: models
      may_depend_on: [kernel]
      third_party: {default: deny, allow: [pydantic]}
    events:
      path: events
      may_depend_on: [kernel, contracts]
      third_party: {default: deny, allow: [pydantic]}
    engine:
      path: runtime
      may_depend_on: [kernel, contracts, events]
      third_party: {default: deny, allow: [pydantic]}
    plugins:
      path: plugins
      may_depend_on: [kernel, contracts, events, engine, model_adapters]
      third_party: {default: deny, allow: [pydantic, pydantic_ai, yaml, fastmcp, mcp, jsonschema, referencing, httpx2, anyio]}
    model_adapters:
      path: models.pydantic_ai
      may_depend_on: [kernel, contracts]
      third_party: {default: deny, allow: [pydantic, pydantic_ai]}
    integrations:
      path: integrations
      may_depend_on: [kernel, contracts, events, engine, plugins]
      third_party: {default: deny, allow: [pydantic, opentelemetry]}
    sdk:
      path: sdk
      may_depend_on: [kernel, contracts, events, engine, plugins, model_adapters]
      third_party: {default: deny, allow: [pydantic, pydantic_ai]}
    testing:
      path: testing
      may_depend_on: [kernel, contracts, events, engine, plugins, model_adapters, sdk]
      third_party: {default: deny, allow: [pydantic, pydantic_ai, pytest]}
  import_graph:
    type_checking: include
    transitive: true
    # Exact module cycles catch runtime coupling without conflating subpackages.
    # Annotation dependencies still participate in every boundary check.
    cycles: [layers, modules]
    type_checking_cycles: ignore

  packages:
    model-adapter-api:
      match: harnessed.models.pydantic_ai
      required: [adapter, conversion]
    mcp-api:
      match: harnessed.plugins.mcp
      required: [plugin, transport]
    worker-api:
      match: harnessed.integrations.sandbox.worker
      required: [models, filesystem, runtime, __main__]
    tool-facade:
      match: harnessed.tools
      min_imports_to_bundle: 3
      min_importers_to_export: 3
    kernel-api:
      match: harnessed.kernel
      public: ['.']

style:
  forbidden_names: [utils, helpers]
  max_private_definitions: 12
  future_annotations: when-needed
  ordering:
    module: [docstring, future-imports, imports, type-vars, public, private, dunder-assignments, main-guard]
    fix: safe-only
  max_positional_parameters: 3
  max_comprehension_loops: 1
  max_constructor_decisions: 2
  str_enum_values: explicit
  call_argument_kinds: [await, comprehension, aggregate]
  file_naming:
    yaml_extension: yaml
  overrides:
    model-adapter-structure:
      match: harnessed.models.pydantic_ai
      rules:
        complexity/excess-constructor-decisions: error
        complexity/excess-comprehension-loops: error
    mcp-structure:
      match: harnessed.plugins.mcp
      rules:
        complexity/excess-constructor-decisions: error
        complexity/excess-comprehension-loops: error
    worker-structure:
      match: harnessed.integrations.sandbox.worker
      rules:
        complexity/excess-constructor-decisions: error
        complexity/excess-comprehension-loops: error
    kernel-cooperation:
      match: harnessed.kernel
      private_attribute_boundary:
        value: package
        reason: Scope, PluginHandle, EventBus and descriptors share kernel-owned state. Higher layers use public kernel operations.

tests:
  layout: none  # Topic groups and consumer typing contracts need not mirror modules.
  max_patches_per_test: 3

ignore:
  - rule: architecture/unknown-layer
    paths: [harnessed/prompts/__init__.py, harnessed/sessions/__init__.py, harnessed/tools/__init__.py]
    reason: These packages are explicitly mapped to the engine layer; the directory check recognizes only that layer's primary path.
  - rule: visibility/misplaced-dunder-all
    paths:
      - harnessed/errors.py
      - harnessed/hooks.py
      - harnessed/tracing.py
      - harnessed/integrations/bubblewrap.py
      - harnessed/integrations/json.py
      - harnessed/integrations/opentelemetry.py
      - harnessed/context.py
      - harnessed/plugins/subagents.py
    reason: Single-module public facades are documented import paths; optional-extra modules cannot be re-exported eagerly from their package initializer.
  - rule: layout/file-name-convention
    paths: [.github/workflows/release.yml]
    reason: PyPI trusted publishing is registered for this exact workflow filename.
  - rule: tests/private-access
    paths: [tests/core/session/test_image_cache.py]
    reason: Cache unit tests measure private byte/entry bounds and eviction; SDK behavior is tested separately in test_image_assets.py.

# Adopted conventions fail checks; design review suggestions remain hints.
rules:
  # Source structure
  architecture/import-cycle: error
  layout/definition-order: error
  idioms/bundled-instance-assignment: error
  imports/prefer-package-import: error
  imports/excess-package-imports: warning
  layout/misplaced-static-helper: error
  typing/redundant-future-annotations: error
  idioms/prefer-match-type-dispatch: error
  typing/implicit-optional-default: error
  visibility/misplaced-dunder-all: error
  visibility/foreign-private-access: error
  layout/misplaced-private-constant: error
  complexity/inline-call-argument: error
  typing/deprecated-async-contextmanager-return: error
  layout/redundant-module-name: error
  visibility/redundant-private-delegate: error
  idioms/redundant-name-alias: error
  typing/prefer-deferred-annotations: error
  complexity/forbidden-nested-conditional: error
  idioms/missing-interface-docstring: error
  idioms/missing-broad-except-reason: error
  complexity/duplicate-function: error
  modeling/duplicate-class-name: error
  idioms/duplicate-narrowing-assert: error
  modeling/parallel-record-fields: error
  modeling/mutable-field-in-frozen-dataclass: error
  visibility/excess-private-definitions: error
  # Naming and types
  modeling/forbidden-base-class-affix: error
  modeling/redundant-str-enum-value: error
  modeling/str-enum-value-convention: error
  modeling/prefer-str-enum-discriminator: error
  typing/duplicate-literal-type: error
  typing/anonymous-tuple-type: error
  # Public API surface, including APIs exposed only for tests (SMT316/320/335/429/430)
  visibility/internal-public-member: error
  visibility/internal-public-module-symbol: error
  visibility/internal-public-attribute: error
  visibility/test-only-public-function: error
  visibility/test-only-public-attribute: error
  # Tests
  tests/private-access: error
  tests/string-patch-target: error
  tests/missing-outcome-check: error
  tests/vacuous-assertion: error
  tests/unbounded-wait: error
  tests/missing-await-assertion: error
  tests/nondeterministic-data: error
  # Design reviews
  complexity/excess-attribute-depth: hint
  tests/independent-case-loop: hint
  modeling/dataclass-field-mutation: hint
  modeling/implicit-duration-unit:
    severity: hint
    reason: SMT357 combines literal waits with existing asyncio-style timeout names whose unit is defined by their API contracts.
  idioms/loop-invariant-collection: hint
  complexity/excess-comprehension-loops: hint
  complexity/excess-constructor-decisions: hint

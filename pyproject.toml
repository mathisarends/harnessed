[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessed"
version = "0.27.1"
description = "A composable Python agent SDK with reversible plugins and explicit conversation state."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mathisarends" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pydantic>=2.12,<3"]

[project.urls]
Documentation = "https://github.com/mathisarends/harnessed/blob/main/docs/index.md"
Repository = "https://github.com/mathisarends/harnessed"
Issues = "https://github.com/mathisarends/harnessed/issues"
Changelog = "https://github.com/mathisarends/harnessed/blob/main/CHANGELOG.md"

[project.optional-dependencies]
openai = ["pydantic-ai-slim[openai]>=2.63,<3"]
anthropic = ["pydantic-ai-slim[anthropic]>=2.63,<3"]
google = ["pydantic-ai-slim[google]>=2.63,<3"]
skills = ["pyyaml>=6.0.3,<7"]
mcp = [
    "mcp>=2.3,<3",
    "jsonschema>=4.26,<5",
    "fastmcp-slim[client]>=4.1.2,<5",
]
otel = [
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[dependency-groups]
dev = [
    # Server dependencies are used only by MCP client integration-test fixtures.
    "fastmcp-slim[server]>=4.1.2,<5",
    "mkdocs>=1.6,<2",
    "prek>=0.5.9,<0.6",
    "pylint>=4.1.3,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.17.3,<1",
    "smelt-cli==0.16.1",
    "twine>=6.2,<8",
    "ty>=0.0.93,<0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harnessed*"]

[tool.setuptools.package-data]
harnessed = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
# The Smelt agent skill is generated by `smelt skill install` and vendored verbatim.
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "ASYNC", "TID252", "PLC0415",
    # Readability: bounded complexity and simpler, canonical expressions.
    "C90", "PLR0911", "PLR0912", "PLR0915", "SIM", "C4", "RUF", "PTH",
    # Interface hygiene: unused parameters, boolean flags and private access.
    "ARG", "FBT", "SLF001",
]
# Duration units are checked by Smelt MOD010.
# Smelt IDM006 requires reasons for broad exception handlers.
# Architecture tests require plain sorted `__all__`; RUF022 uses isort-style order.
# FBT001/FBT002 guard our signatures; FBT003 would only flag external positional APIs
# such as OpenTelemetry attributes and Win32 calls.
ignore = ["ASYNC109", "RUF022", "FBT003"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Provider SDKs are optional; importing the core must not require an extra.
"harnessed/models/pydantic_ai/**/*.py" = ["PLC0415"]
"harnessed/plugins/skills.py" = ["PLC0415"]
# Classes of the standalone kernel cooperate through private state by design;
# Smelt checks known receivers at the kernel package boundary (VIS005).
"harnessed/kernel/**/*.py" = ["SLF001"]
# Tests import optional integrations and patch import failures in their own scope.
# Fakes implement protocols with unused parameters. Smelt TST002 checks private access.
# Tests include intentionally ambiguous Unicode inputs.
"tests/**/*.py" = ["PLC0415", "ARG", "FBT", "SLF001", "C90", "PLR09", "RUF001"]

[tool.ruff.lint.flake8-bugbear]
# Frozen value objects are safe shared dataclass defaults.
extend-immutable-calls = [
    "harnessed.tools.info.ToolEnvelope",
    "harnessed.tools.info.ToolPresentation",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.src]
include = ["harnessed", "examples", "scripts", "tests/typing"]

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pylint.main]
py-version = "3.12"
recursive = true
prefer-stubs = true
persistent = false

[tool.pylint.messages_control]
# Ruff owns syntax/style, ty owns types, and Smelt owns architecture.
# Pylint adds control-flow, iteration-mutation and override checks. Generic
# call/type inference cannot model the lazy SDK or dependency-injected lifecycle.
disable = ["all"]
enable = [
    "F",
    "possibly-used-before-assignment",
    "used-before-assignment",
    "modified-iterating-list",
    "modified-iterating-dict",
    "modified-iterating-set",
    "arguments-renamed",
    "invalid-overridden-method",
    "overridden-final-method",
    "subclassed-final-class",
]

[tool.pylint.reports]
reports = false
score = false
